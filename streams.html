    function escapeHtml(value) {

        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

      const parts = time.split(":").map(Number);

      if (parts.length === 3) {
        return parts[0] * 3600 + parts[1] * 60 + parts[2];
      }

      if (parts.length === 2) {
        return parts[0] * 60 + parts[1];
      }

      return Number(parts[0]) || 0;
    }

    function formatDate(date) {
      return date.replaceAll("-", "／");
    }

    function getSortedStreams() {
      return [...streams].sort((a, b) => b.date.localeCompare(a.date));
    }

    function getFilteredStreams() {
      const sorted = getSortedStreams();

      if (activeYear === "all") {
        return sorted;
      }

      return sorted.filter(stream => stream.date.startsWith(activeYear));
    }

    // ------------------------------------------------------------
    // 自動統計
    // ------------------------------------------------------------
    function renderStats() {
      const allSongs = streams.flatMap(stream => stream.songs);

      const uniqueSongCount = new Set(
        allSongs.map(item =>
          item.song.toLowerCase() + "|" + item.original.toLowerCase()
        )
      ).size;

      document.getElementById("streamCount").textContent = streams.length;
      document.getElementById("performanceCount").textContent = allSongs.length;
      document.getElementById("uniqueSongCount").textContent = uniqueSongCount;
    }

    // ------------------------------------------------------------
    // 年份按鈕：從資料自動抓年份，不需要手動增加 2027、2028...
    // ------------------------------------------------------------
    function renderYearFilters() {
      const years = [...new Set(
        streams.map(stream => stream.date.slice(0, 4))
      )].sort((a, b) => b.localeCompare(a));

      const buttons = [
        { value: "all", label: "全部" },
        ...years.map(year => ({ value: year, label: year }))
      ];

      yearFilters.innerHTML = buttons.map(button => `
        <button
          class="year-button ${activeYear === button.value ? "active" : ""}"
          type="button"
          data-year="${button.value}"
        >
          ${button.label}
        </button>
      `).join("");
    }

    // ------------------------------------------------------------
    // 建立單場歌單
    // ------------------------------------------------------------
    function buildSongList(stream) {
      const rows = stream.songs.map((item, index) => {
        const note = item.note
          ? `<span class="song-note">${escapeHtml(item.note)}</span>`
          : "";

        const timeLinks = item.parts.map(part => {
          const seconds = timeToSeconds(part.time);
          const label = part.label ? `${escapeHtml(part.label)} ` : "";

          return `
            <a
              href="https://www.youtube.com/watch?v=${encodeURIComponent(stream.videoId)}&t=${seconds}s"
              target="_blank"
              rel="noopener noreferrer"
            >
              ${label}${escapeHtml(part.time)} ▶
            </a>
          `;
        }).join("<br>");

        return `
          <div class="songlist-row">
            <div class="song-index">${String(index + 1).padStart(2, "0")}</div>

            <div>
              <div class="song-name">
                ${escapeHtml(item.song)}${note}
              </div>
              <div class="song-original">
                原唱：${escapeHtml(item.original)}
              </div>
            </div>

            <div class="song-time">
              ${timeLinks}
            </div>
          </div>
        `;
      }).join("");

      return `
        <div class="stream-songlist" data-songlist="${escapeHtml(stream.id)}" hidden>
          <div class="songlist-heading">
            <h3>SETLIST</h3>
            <span>${stream.songs.length} 首演唱紀錄</span>
          </div>
          <div class="songlist-items">
            ${rows}
          </div>
        </div>
      `;
    }

    // ------------------------------------------------------------
    // 建立歌回卡片
    // ------------------------------------------------------------
    function buildStreamCard(stream) {
      const youtubeUrl = `https://www.youtube.com/watch?v=${encodeURIComponent(stream.videoId)}`;
      const thumbnailUrl = `https://img.youtube.com/vi/${encodeURIComponent(stream.videoId)}/hqdefault.jpg`;

      return `
        <article class="stream-card" data-stream-card="${escapeHtml(stream.id)}">
          <div class="stream-main">
            <a
              class="thumbnail-link"
              href="${youtubeUrl}"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                class="stream-thumbnail"
                src="${thumbnailUrl}"
                alt="${escapeHtml(stream.shortTitle)}"
              >
            </a>

            <div class="stream-info">
              <div class="stream-date">${formatDate(stream.date)}</div>

              <h2 class="stream-title" title="${escapeHtml(stream.title)}">
                ${escapeHtml(stream.shortTitle)}
              </h2>

              <div class="stream-count">
                ${stream.songs.length} 首演唱紀錄
              </div>

              <div class="stream-actions">
                <a
                  class="stream-link"
                  href="${youtubeUrl}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  前往 YouTube
                </a>

                <button
                  class="stream-toggle-button"
                  type="button"
                  data-stream-toggle="${escapeHtml(stream.id)}"
                  aria-expanded="false"
                >
                  查看歌單
                </button>
              </div>
            </div>
          </div>

          ${buildSongList(stream)}
        </article>
      `;
    }

    // ------------------------------------------------------------
    // 顯示歌回 + 分頁
    // ------------------------------------------------------------
    function renderStreams() {
      const filtered = getFilteredStreams();
      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));

      if (currentPage > totalPages) {
        currentPage = totalPages;
      }

      const start = (currentPage - 1) * PAGE_SIZE;
      const pageItems = filtered.slice(start, start + PAGE_SIZE);

      streamList.innerHTML = pageItems.map(buildStreamCard).join("");
      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      if (totalPages <= 1) {
        pagination.innerHTML = "";
        return;
      }

      let html = `
        <button
          class="page-button"
          type="button"
          data-page="prev"
          ${currentPage === 1 ? "disabled" : ""}
        >
          ← 上一頁
        </button>
      `;

      for (let page = 1; page <= totalPages; page += 1) {
        html += `
          <button
            class="page-button ${currentPage === page ? "active" : ""}"
            type="button"
            data-page="${page}"
          >
            ${page}
          </button>
        `;
      }

      html += `
        <button
          class="page-button"
          type="button"
          data-page="next"
          ${currentPage === totalPages ? "disabled" : ""}
        >
          下一頁 →
        </button>
      `;

      pagination.innerHTML = html;
    }

    // ------------------------------------------------------------
    // 年份切換
    // ------------------------------------------------------------
    yearFilters.addEventListener("click", event => {
      const button = event.target.closest("[data-year]");
      if (!button) return;

      activeYear = button.dataset.year;
      currentPage = 1;

      renderYearFilters();
      renderStreams();
    });

    // ------------------------------------------------------------
    // 查看歌單：一次只展開一場
    // ------------------------------------------------------------
    streamList.addEventListener("click", event => {
      const button = event.target.closest("[data-stream-toggle]");
      if (!button) return;

      const streamId = button.dataset.streamToggle;
      const targetPanel = streamList.querySelector(`[data-songlist="${streamId}"]`);
      const isOpening = targetPanel.hidden;

      // 先收起所有歌單
      streamList.querySelectorAll("[data-songlist]").forEach(panel => {
        panel.hidden = true;
      });

      streamList.querySelectorAll("[data-stream-toggle]").forEach(toggle => {
        toggle.textContent = "查看歌單";
        toggle.setAttribute("aria-expanded", "false");
      });

      // 如果原本是關閉狀態，就打開這一場
      if (isOpening) {
        targetPanel.hidden = false;
        button.textContent = "收起歌單";
        button.setAttribute("aria-expanded", "true");
      }
    });

    // ------------------------------------------------------------
    // 分頁切換
    // ------------------------------------------------------------
    pagination.addEventListener("click", event => {
      const button = event.target.closest("[data-page]");
      if (!button || button.disabled) return;

      const filtered = getFilteredStreams();
      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      const target = button.dataset.page;

      if (target === "prev") {
        currentPage = Math.max(1, currentPage - 1);
      } else if (target === "next") {
        currentPage = Math.min(totalPages, currentPage + 1);
      } else {
        currentPage = Number(target);
      }

      renderStreams();

      document.getElementById("streamIndexSection").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    });

    // 初始顯示
    renderStats();
    renderYearFilters();
    renderStreams();
  </script>

</body>
</html>
