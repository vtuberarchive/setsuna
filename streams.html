<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>STREAMS｜剎那 SETSUNA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #0d0f14;
      color: #f5f5f5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13, 15, 20, 0.95);
      border-bottom: 1px solid #242833;
      backdrop-filter: blur(10px);
    }

    .nav {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
    }

    .logo span {
      color: #ff7aa8;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links a {
      color: #c8ccd5;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .nav-links a:hover,
    .nav-links .active {
      color: #ff7aa8;
    }

    main {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 24px 100px;
    }

    /* HERO */
    .streams-hero {
      margin-bottom: 52px;
    }

    .streams-hero h1 {
      margin: 0;
      font-size: clamp(48px, 7vw, 82px);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .streams-hero h1 span {
      color: #ff7aa8;
    }

    .streams-intro {
      margin: 24px 0 0;
      max-width: 720px;
      color: #c5cad3;
      font-size: 17px;
      line-height: 1.9;
    }

    /* STATS */
    .stream-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 44px;
    }

    .stat-card {
      padding: 24px;
      background: #151820;
      border: 1px solid #242936;
      border-radius: 18px;
    }

    .stat-number {
      margin-bottom: 8px;
      font-size: 30px;
      font-weight: 700;
    }

    .stat-label {
      color: #8f96a3;
      font-size: 14px;
    }

    /* YEAR FILTER */
    .year-filter-wrap {
      margin-bottom: 44px;
    }

    .year-filter-label {
      margin-bottom: 12px;
      color: #858b98;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .year-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .year-button {
      padding: 9px 16px;
      border: 1px solid #343946;
      border-radius: 999px;
      background: transparent;
      color: #c8ccd5;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .year-button:hover,
    .year-button.active {
      border-color: #ff7aa8;
      color: #ff7aa8;
    }

    .year-button.active {
      background: rgba(255, 122, 168, 0.08);
    }

    /* STREAM CARDS */
    .section-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 28px;
    }

    .section-title p {
      margin: 0;
      color: #858b98;
      font-size: 14px;
    }

    .stream-list {
      display: grid;
      gap: 26px;
    }

    .stream-card {
      overflow: hidden;
      background: #151820;
      border: 1px solid #242936;
      border-radius: 20px;
      transition: 0.25s ease;
    }

    .stream-card:hover {
      border-color: #ff7aa8;
      transform: translateY(-6px);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
    }

    .stream-main {
      display: grid;
      grid-template-columns: 320px 1fr;
    }

    .thumbnail-link {
      display: block;
      background: #000;
    }

    .stream-thumbnail {
      width: 100%;
      height: 100%;
      min-height: 200px;
      object-fit: cover;
      display: block;
    }

    .stream-info {
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stream-date {
      margin-bottom: 10px;
      color: #ff7aa8;
      font-size: 15px;
      font-weight: 700;
    }

    .stream-title {
      margin: 0;
      font-size: 25px;
      line-height: 1.5;
    }

    .stream-count {
      margin-top: 10px;
      color: #8f96a3;
      font-size: 14px;
    }

    .stream-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .stream-link,
    .stream-toggle-button {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid #ff7aa8;
      border-radius: 999px;
      background: transparent;
      color: #ff7aa8;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .stream-link:hover,
    .stream-toggle-button:hover {
      background: #ff7aa8;
      color: #0d0f14;
    }

    /* EXPANDED SETLIST */
    .stream-songlist {
      padding: 26px 30px 30px;
      border-top: 1px solid #242936;
      background: #11141b;
    }

    .stream-songlist[hidden] {
      display: none;
    }

    .songlist-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .songlist-heading h3 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.06em;
    }

    .songlist-heading span {
      color: #858b98;
      font-size: 13px;
    }

    .songlist-items {
      border-top: 1px solid #242936;
    }

    .songlist-row {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) 180px;
      align-items: center;
      gap: 18px;
      padding: 16px 0;
      border-bottom: 1px solid #242936;
    }

    .song-index {
      color: #666e7d;
      font-size: 13px;
      font-weight: 700;
    }

    .song-name {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.5;
    }

    .song-original {
      margin-top: 4px;
      color: #9298a5;
      font-size: 13px;
      line-height: 1.5;
    }

    .song-note {
      display: inline-block;
      margin-left: 7px;
      padding: 3px 7px;
      border-radius: 6px;
      background: #512537;
      color: #ffd1df;
      font-size: 11px;
      vertical-align: middle;
    }

    .song-time {
      color: #ff9bbc;
      font-size: 14px;
      font-weight: 700;
      text-align: right;
      white-space: nowrap;
    }

    .song-time a {
      display: inline-block;
      margin: 2px 0;
    }

    .song-time a:hover {
      color: #ff7aa8;
    }

    /* PAGINATION */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 34px;
    }

    .pagination:empty {
      display: none;
    }

    .page-button {
      min-width: 40px;
      height: 40px;
      padding: 0 12px;
      border: 1px solid #343946;
      border-radius: 10px;
      background: #151820;
      color: #c8ccd5;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .page-button:hover,
    .page-button.active {
      border-color: #ff7aa8;
      color: #ff7aa8;
    }

    .page-button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .page-button:disabled:hover {
      border-color: #343946;
      color: #c8ccd5;
    }

    /* MOBILE */
    @media (max-width: 760px) {
      .nav-links {
        gap: 12px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      main {
        padding: 50px 20px 70px;
      }

      .stream-stats {
        grid-template-columns: 1fr;
      }

      .section-title {
        display: block;
      }

      .section-title p {
        margin-top: 8px;
      }

      .stream-main {
        grid-template-columns: 1fr;
      }

      .stream-thumbnail {
        min-height: auto;
        aspect-ratio: 16 / 9;
      }

      .stream-info {
        padding: 24px;
      }

      .stream-songlist {
        padding: 22px 24px 24px;
      }

      .songlist-row {
        grid-template-columns: 36px 1fr;
        gap: 12px;
      }

      .song-time {
        grid-column: 2;
        text-align: left;
        white-space: normal;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="nav">

      <div class="logo">
        VTuber <span>Archive</span>
      </div>

      <nav class="nav-links">
        <a href="index.html">HOME</a>
        <a href="profile.html">PROFILE</a>
        <a href="streams.html" class="active">STREAMS</a>
        <a href="index.html#merch">MERCH</a>
        <a href="index.html#about">ABOUT</a>
      </nav>

    </div>
  </header>

  <main>

    <!-- HERO -->
    <section class="streams-hero">
      <h1>
        Singing <span>Streams</span>
      </h1>

      <p class="streams-intro">
        收錄剎那 SETSUNA 的歌回與演唱直播紀錄。<br>
        可依年份瀏覽歌回，點選「查看歌單」即可在原地展開當場演唱紀錄。
      </p>
    </section>

    <!-- STATS -->
    <section class="stream-stats">
      <div class="stat-card">
        <div class="stat-number" id="streamCount">—</div>
        <div class="stat-label">收錄歌回</div>
      </div>

      <div class="stat-card">
        <div class="stat-number" id="performanceCount">—</div>
        <div class="stat-label">演唱紀錄</div>
      </div>

      <div class="stat-card">
        <div class="stat-number" id="uniqueSongCount">—</div>
        <div class="stat-label">不重複歌曲</div>
      </div>
    </section>

    <!-- YEAR FILTER -->
    <section class="year-filter-wrap">
      <div class="year-filter-label">YEAR</div>
      <div class="year-filters" id="yearFilters"></div>
    </section>

    <!-- STREAM INDEX -->
    <section id="streamIndexSection">
      <div class="section-title">
        <h2>歌回場次</h2>
        <p>點選「查看歌單」可直接展開當日演唱紀錄</p>
      </div>

      <div class="stream-list" id="streamList"></div>
      <div class="pagination" id="pagination"></div>
    </section>

  </main>

  <script src="data.js"></script>

  <script>
    // ============================================================
    // 共用資料：從 data.js 讀取
    // 之後新增歌回與歌曲，只需要修改 data.js。
    // streams.html 只負責顯示，不再重複保存資料。
    // ============================================================

    const sourceData = window.SETSUNA_DATA || { streams: [], songs: [] };

    const songs = Array.isArray(sourceData.songs)
      ? sourceData.songs
      : [];

    const streams = Array.isArray(sourceData.streams)
      ? sourceData.streams.map(stream => ({
          ...stream,
          title: stream.fullTitle || stream.title || stream.shortTitle,
          songs: songs.filter(song => song.streamId === stream.id)
        }))
      : [];

    // 每頁顯示幾場。未來歌回很多時可以只改這個數字。
    const PAGE_SIZE = 12;

    let activeYear = "all";
    let currentPage = 1;

    const streamList = document.getElementById("streamList");
    const yearFilters = document.getElementById("yearFilters");
    const pagination = document.getElementById("pagination");

    // ------------------------------------------------------------
    // 工具：避免資料中的特殊符號被當成 HTML
    // ------------------------------------------------------------
    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    // ------------------------------------------------------------
    // 工具：HH:MM:SS → 秒數
    // 例如 00:31:08 → 1868
    // ------------------------------------------------------------
    function timeToSeconds(time) {
      const parts = time.split(":").map(Number);

      if (parts.length === 3) {
        return parts[0] * 3600 + parts[1] * 60 + parts[2];
      }

      if (parts.length === 2) {
        return parts[0] * 60 + parts[1];
      }

      return Number(parts[0]) || 0;
    }

    function formatDate(date) {
      return date.replaceAll("-", "／");
    }

    function getSortedStreams() {
      return [...streams].sort((a, b) => b.date.localeCompare(a.date));
    }

    function getFilteredStreams() {
      const sorted = getSortedStreams();

      if (activeYear === "all") {
        return sorted;
      }

      return sorted.filter(stream => stream.date.startsWith(activeYear));
    }

    // ------------------------------------------------------------
    // 自動統計
    // ------------------------------------------------------------
    function renderStats() {
      const allSongs = streams.flatMap(stream => stream.songs);

      const uniqueSongCount = new Set(
        allSongs.map(item =>
          item.song.toLowerCase() + "|" + item.original.toLowerCase()
        )
      ).size;

      document.getElementById("streamCount").textContent = streams.length;
      document.getElementById("performanceCount").textContent = allSongs.length;
      document.getElementById("uniqueSongCount").textContent = uniqueSongCount;
    }

    // ------------------------------------------------------------
    // 年份按鈕：從資料自動抓年份，不需要手動增加 2027、2028...
    // ------------------------------------------------------------
    function renderYearFilters() {
      const years = [...new Set(
        streams.map(stream => stream.date.slice(0, 4))
      )].sort((a, b) => b.localeCompare(a));

      const buttons = [
        { value: "all", label: "全部" },
        ...years.map(year => ({ value: year, label: year }))
      ];

      yearFilters.innerHTML = buttons.map(button => `
        <button
          class="year-button ${activeYear === button.value ? "active" : ""}"
          type="button"
          data-year="${button.value}"
        >
          ${button.label}
        </button>
      `).join("");
    }

    // ------------------------------------------------------------
    // 建立單場歌單
    // ------------------------------------------------------------
    function buildSongList(stream) {
      const rows = stream.songs.map((item, index) => {
        const note = item.note
          ? `<span class="song-note">${escapeHtml(item.note)}</span>`
          : "";

        const timeLinks = item.parts.map(part => {
          const seconds = timeToSeconds(part.time);
          const label = part.label ? `${escapeHtml(part.label)} ` : "";

          return `
            <a
              href="https://www.youtube.com/watch?v=${encodeURIComponent(stream.videoId)}&t=${seconds}s"
              target="_blank"
              rel="noopener noreferrer"
            >
              ${label}${escapeHtml(part.time)} ▶
            </a>
          `;
        }).join("<br>");

        return `
          <div class="songlist-row">
            <div class="song-index">${String(index + 1).padStart(2, "0")}</div>

            <div>
              <div class="song-name">
                ${escapeHtml(item.song)}${note}
              </div>
              <div class="song-original">
                原唱：${escapeHtml(item.original)}
              </div>
            </div>

            <div class="song-time">
              ${timeLinks}
            </div>
          </div>
        `;
      }).join("");

      return `
        <div class="stream-songlist" data-songlist="${escapeHtml(stream.id)}" hidden>
          <div class="songlist-heading">
            <h3>SETLIST</h3>
            <span>${stream.songs.length} 首演唱紀錄</span>
          </div>
          <div class="songlist-items">
            ${rows}
          </div>
        </div>
      `;
    }

    // ------------------------------------------------------------
    // 建立歌回卡片
    // ------------------------------------------------------------
    function buildStreamCard(stream) {
      const youtubeUrl = `https://www.youtube.com/watch?v=${encodeURIComponent(stream.videoId)}`;
      const thumbnailUrl = `https://img.youtube.com/vi/${encodeURIComponent(stream.videoId)}/hqdefault.jpg`;

      return `
        <article class="stream-card" data-stream-card="${escapeHtml(stream.id)}">
          <div class="stream-main">
            <a
              class="thumbnail-link"
              href="${youtubeUrl}"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                class="stream-thumbnail"
                src="${thumbnailUrl}"
                alt="${escapeHtml(stream.shortTitle)}"
              >
            </a>

            <div class="stream-info">
              <div class="stream-date">${formatDate(stream.date)}</div>

              <h2 class="stream-title" title="${escapeHtml(stream.title)}">
                ${escapeHtml(stream.shortTitle)}
              </h2>

              <div class="stream-count">
                ${stream.songs.length} 首演唱紀錄
              </div>

              <div class="stream-actions">
                <a
                  class="stream-link"
                  href="${youtubeUrl}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  前往 YouTube
                </a>

                <button
                  class="stream-toggle-button"
                  type="button"
                  data-stream-toggle="${escapeHtml(stream.id)}"
                  aria-expanded="false"
                >
                  查看歌單
                </button>
              </div>
            </div>
          </div>

          ${buildSongList(stream)}
        </article>
      `;
    }

    // ------------------------------------------------------------
    // 顯示歌回 + 分頁
    // ------------------------------------------------------------
    function renderStreams() {
      const filtered = getFilteredStreams();
      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));

      if (currentPage > totalPages) {
        currentPage = totalPages;
      }

      const start = (currentPage - 1) * PAGE_SIZE;
      const pageItems = filtered.slice(start, start + PAGE_SIZE);

      streamList.innerHTML = pageItems.map(buildStreamCard).join("");
      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      if (totalPages <= 1) {
        pagination.innerHTML = "";
        return;
      }

      let html = `
        <button
          class="page-button"
          type="button"
          data-page="prev"
          ${currentPage === 1 ? "disabled" : ""}
        >
          ← 上一頁
        </button>
      `;

      for (let page = 1; page <= totalPages; page += 1) {
        html += `
          <button
            class="page-button ${currentPage === page ? "active" : ""}"
            type="button"
            data-page="${page}"
          >
            ${page}
          </button>
        `;
      }

      html += `
        <button
          class="page-button"
          type="button"
          data-page="next"
          ${currentPage === totalPages ? "disabled" : ""}
        >
          下一頁 →
        </button>
      `;

      pagination.innerHTML = html;
    }

    // ------------------------------------------------------------
    // 年份切換
    // ------------------------------------------------------------
    yearFilters.addEventListener("click", event => {
      const button = event.target.closest("[data-year]");
      if (!button) return;

      activeYear = button.dataset.year;
      currentPage = 1;

      renderYearFilters();
      renderStreams();
    });

    // ------------------------------------------------------------
    // 查看歌單：一次只展開一場
    // ------------------------------------------------------------
    streamList.addEventListener("click", event => {
      const button = event.target.closest("[data-stream-toggle]");
      if (!button) return;

      const streamId = button.dataset.streamToggle;
      const targetPanel = streamList.querySelector(`[data-songlist="${streamId}"]`);
      const isOpening = targetPanel.hidden;

      // 先收起所有歌單
      streamList.querySelectorAll("[data-songlist]").forEach(panel => {
        panel.hidden = true;
      });

      streamList.querySelectorAll("[data-stream-toggle]").forEach(toggle => {
        toggle.textContent = "查看歌單";
        toggle.setAttribute("aria-expanded", "false");
      });

      // 如果原本是關閉狀態，就打開這一場
      if (isOpening) {
        targetPanel.hidden = false;
        button.textContent = "收起歌單";
        button.setAttribute("aria-expanded", "true");
      }
    });

    // ------------------------------------------------------------
    // 分頁切換
    // ------------------------------------------------------------
    pagination.addEventListener("click", event => {
      const button = event.target.closest("[data-page]");
      if (!button || button.disabled) return;

      const filtered = getFilteredStreams();
      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      const target = button.dataset.page;

      if (target === "prev") {
        currentPage = Math.max(1, currentPage - 1);
      } else if (target === "next") {
        currentPage = Math.min(totalPages, currentPage + 1);
      } else {
        currentPage = Number(target);
      }

      renderStreams();

      document.getElementById("streamIndexSection").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    });

    // 初始顯示
    renderStats();
    renderYearFilters();
    renderStreams();
  </script>

</body>
</html>
