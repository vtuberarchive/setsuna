<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SONG SEARCH｜剎那 SETSUNA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #0d0f14;
      color: #f5f5f5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13, 15, 20, 0.95);
      border-bottom: 1px solid #242833;
      backdrop-filter: blur(10px);
    }

    .nav {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
    }

    .logo span {
      color: #ff7aa8;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links a {
      color: #c8ccd5;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .nav-links a:hover,
    .nav-links .active {
      color: #ff7aa8;
    }

    main {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 24px 100px;
    }

    /* HERO */
    .search-hero {
      margin-bottom: 52px;
    }

    .search-hero h1 {
      margin: 0;
      font-size: clamp(48px, 7vw, 82px);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .search-hero h1 span {
      color: #ff7aa8;
    }

    .search-intro {
      margin: 24px 0 0;
      max-width: 720px;
      color: #c5cad3;
      font-size: 17px;
      line-height: 1.9;
    }

    /* SEARCH */
    .search-wrap {
      margin-bottom: 44px;
    }

    .search-label {
      margin-bottom: 12px;
      color: #858b98;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .search-row {
      display: flex;
      gap: 12px;
    }

    .search-box {
      width: 100%;
      padding: 15px 18px;
      border: 1px solid #343946;
      border-radius: 14px;
      outline: none;
      background: #151820;
      color: #f5f5f5;
      transition: 0.2s ease;
    }

    .search-box::placeholder {
      color: #6f7684;
    }

    .search-box:focus {
      border-color: #ff7aa8;
      box-shadow: 0 0 0 3px rgba(255, 122, 168, 0.08);
    }

    .clear-button {
      flex-shrink: 0;
      padding: 10px 20px;
      border: 1px solid #ff7aa8;
      border-radius: 999px;
      background: transparent;
      color: #ff7aa8;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .clear-button:hover {
      background: #ff7aa8;
      color: #0d0f14;
    }

    .search-help {
      margin: 12px 0 0;
      color: #858b98;
      font-size: 13px;
      line-height: 1.7;
    }

    /* SECTION TITLE */
    .section-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 28px;
    }

    .section-title p {
      margin: 0;
      color: #858b98;
      font-size: 14px;
    }

    /* RESULTS */
    .results {
      display: grid;
      gap: 18px;
    }

    .result-card {
      display: grid;
      grid-template-columns:
        minmax(0, 1.2fr)
        minmax(220px, 0.9fr)
        180px;
      align-items: center;
      gap: 24px;
      padding: 24px 28px;

      background: #151820;
      border: 1px solid #242936;
      border-radius: 20px;

      transition: 0.25s ease;
    }

    .result-card:hover {
      border-color: #ff7aa8;
      transform: translateY(-6px);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
    }

    .song-name {
      color: #f5f5f5;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.5;
    }

    .song-original {
      margin-top: 5px;
      color: #9298a5;
      font-size: 13px;
      line-height: 1.5;
    }

    .song-note {
      display: inline-block;
      margin-top: 9px;
      padding: 3px 7px;
      border-radius: 6px;
      background: #512537;
      color: #ffd1df;
      font-size: 11px;
    }

    .stream-date {
      margin-bottom: 6px;
      color: #ff7aa8;
      font-size: 14px;
      font-weight: 700;
    }

    .stream-title {
      color: #c5cad3;
      font-size: 14px;
      line-height: 1.6;
    }

    .song-time {
      color: #ff9bbc;
      font-size: 14px;
      font-weight: 700;
      text-align: right;
      white-space: nowrap;
    }

    .song-time a {
      display: inline-block;
      margin: 2px 0;
    }

    .song-time a:hover {
      color: #ff7aa8;
    }

    .empty {
      padding: 40px 28px;
      text-align: center;
      color: #888f9c;
      background: #151820;
      border: 1px solid #242936;
      border-radius: 20px;
      line-height: 1.8;
    }

    .empty strong {
      color: #f5f5f5;
    }

    /* PAGINATION */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 34px;
    }

    .pagination:empty {
      display: none;
    }

    .page-button {
      min-width: 40px;
      height: 40px;
      padding: 0 12px;
      border: 1px solid #343946;
      border-radius: 10px;
      background: #151820;
      color: #c8ccd5;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .page-button:hover,
    .page-button.active {
      border-color: #ff7aa8;
      color: #ff7aa8;
    }

    .page-button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .page-button:disabled:hover {
      border-color: #343946;
      color: #c8ccd5;
    }

    /* MOBILE */
    @media (max-width: 760px) {
      .nav-links {
        gap: 12px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      main {
        padding: 50px 20px 70px;
      }

      .search-row {
        flex-direction: column;
      }

      .clear-button {
        padding: 12px 18px;
      }

      .section-title {
        display: block;
      }

      .section-title p {
        margin-top: 8px;
      }

      .result-card {
        grid-template-columns: 1fr;
        gap: 16px;
        padding: 24px;
      }

      .song-time {
        text-align: left;
        white-space: normal;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="nav">

      <div class="logo">
        VTuber <span>Archive</span>
      </div>

      <nav class="nav-links">
        <a href="index.html">HOME</a>
        <a href="profile.html">PROFILE</a>
        <a href="streams.html">STREAMS</a>
        <a href="search.html" class="active">SONG SEARCH</a>
        <a href="index.html#merch">MERCH</a>
        <a href="index.html#about">ABOUT</a>
      </nav>

    </div>
  </header>

  <main>

    <!-- HERO -->
    <section class="search-hero">

      <h1>
        Song <span>Search</span>
      </h1>

      <p class="search-intro">
        搜尋剎那 SETSUNA 的演唱紀錄。<br>
        可依歌名、原唱、日期或歌回名稱搜尋，並直接跳轉至 YouTube 演唱時間軸。
      </p>

    </section>


    <!-- SEARCH -->
    <section class="search-wrap">

      <div class="search-label">
        SEARCH
      </div>

      <div class="search-row">

        <input
          id="searchInput"
          class="search-box"
          type="search"
          autocomplete="off"
          placeholder="搜尋歌名、原唱、日期或歌回，例如：Aimer、晴天、2026-09..."
        >

        <button
          id="clearButton"
          class="clear-button"
          type="button"
        >
          清除
        </button>

      </div>

      <p class="search-help">
        輸入關鍵字後才會顯示搜尋結果，不會一次載出全部演唱紀錄。
      </p>

    </section>


    <!-- RESULTS -->
    <section id="resultSection">

      <div class="section-title">

        <h2>搜尋結果</h2>

        <p id="resultStatus">
          請輸入關鍵字
        </p>

      </div>

      <div
        class="results"
        id="songResults"
      >

        <div class="empty">
          輸入<strong>歌名、原唱、日期或歌回名稱</strong>開始搜尋。
        </div>

      </div>

      <div
        class="pagination"
        id="pagination"
      ></div>

    </section>

  </main>


  <script src="streams-data.js"></script>
  <script src="songs-data.js"></script>

  <script>

    // ============================================================
    // 共用資料
    // ============================================================

    const sourceData =
      window.SETSUNA_DATA || {
        streams: [],
        songs: []
      };

    const streams =
      Array.isArray(sourceData.streams)
        ? sourceData.streams.map(stream => ({
            ...stream,
            title:
              stream.fullTitle ||
              stream.title ||
              stream.shortTitle
          }))
        : [];

    const songs =
      Array.isArray(sourceData.songs)
        ? sourceData.songs
        : [];


    const streamMap =
      new Map(
        streams.map(stream => [
          stream.id,
          stream
        ])
      );


    // 每頁顯示 20 筆搜尋結果
    const PAGE_SIZE = 20;

    let currentPage = 1;
    let currentResults = [];


    const searchInput =
      document.getElementById("searchInput");

    const clearButton =
      document.getElementById("clearButton");

    const songResults =
      document.getElementById("songResults");

    const resultStatus =
      document.getElementById("resultStatus");

    const pagination =
      document.getElementById("pagination");


    // ============================================================
    // 工具：安全輸出 HTML
    // ============================================================

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    // ============================================================
    // 工具：搜尋文字標準化
    // ============================================================

    function normalizeText(value) {
      return String(value ?? "")
        .normalize("NFKC")
        .toLowerCase()
        .trim();
    }


    // ============================================================
    // HH:MM:SS → 秒數
    // ============================================================

    function timeToSeconds(time) {
      const parts =
        String(time || "")
          .split(":")
          .map(Number);

      if (parts.length === 3) {
        return (
          parts[0] * 3600 +
          parts[1] * 60 +
          parts[2]
        );
      }

      if (parts.length === 2) {
        return (
          parts[0] * 60 +
          parts[1]
        );
      }

      return Number(parts[0]) || 0;
    }


    function formatDate(date) {
      return String(date || "")
        .replaceAll("-", "／");
    }


    // ============================================================
    // 搜尋
    // ============================================================

    function performSearch() {

      const rawQuery =
        searchInput.value.trim();

      const query =
        normalizeText(rawQuery);


      if (!query) {

        currentResults = [];
        currentPage = 1;

        resultStatus.textContent =
          "請輸入關鍵字";

        songResults.innerHTML = `
          <div class="empty">
            輸入<strong>歌名、原唱、日期或歌回名稱</strong>開始搜尋。
          </div>
        `;

        pagination.innerHTML = "";

        return;
      }


      const keywords =
        query
          .split(/\s+/)
          .filter(Boolean);


      currentResults =
        songs
          .filter(item => {

            const stream =
              streamMap.get(item.streamId);

            if (!stream) {
              return false;
            }


            const searchable =
              normalizeText([
                item.song,
                item.original,
                item.note,
                stream.date,
                stream.shortTitle,
                stream.title
              ].join(" "));


            return keywords.every(keyword =>
              searchable.includes(keyword)
            );

          })
          .sort((a, b) => {

            const streamA =
              streamMap.get(a.streamId);

            const streamB =
              streamMap.get(b.streamId);


            const dateCompare =
              String(streamB?.date || "")
                .localeCompare(
                  String(streamA?.date || "")
                );


            if (dateCompare !== 0) {
              return dateCompare;
            }


            const timeA =
              a.parts?.[0]?.time || "";

            const timeB =
              b.parts?.[0]?.time || "";


            return timeA.localeCompare(timeB);

          });


      currentPage = 1;

      renderResults(rawQuery);

    }


    // ============================================================
    // 顯示搜尋結果
    // ============================================================

    function renderResults(rawQuery) {

      const totalPages =
        Math.max(
          1,
          Math.ceil(
            currentResults.length /
            PAGE_SIZE
          )
        );


      if (currentPage > totalPages) {
        currentPage = totalPages;
      }


      resultStatus.textContent =
        currentResults.length
          ? `找到 ${currentResults.length} 筆演唱紀錄`
          : "找不到符合的演唱紀錄";


      if (currentResults.length === 0) {

        songResults.innerHTML = `
          <div class="empty">
            找不到符合
            <strong>${escapeHtml(rawQuery)}</strong>
            的演唱紀錄。
          </div>
        `;

        pagination.innerHTML = "";

        return;
      }


      const start =
        (currentPage - 1) *
        PAGE_SIZE;


      const pageItems =
        currentResults.slice(
          start,
          start + PAGE_SIZE
        );


      songResults.innerHTML =
        pageItems
          .map(buildResultCard)
          .join("");


      renderPagination(totalPages);

    }


    // ============================================================
    // 建立結果卡片
    // ============================================================

    function buildResultCard(item) {

      const stream =
        streamMap.get(item.streamId);

      if (!stream) {
        return "";
      }


      const original =
        String(item.original || "").trim()
          ? `
            <div class="song-original">
              原唱：${escapeHtml(item.original)}
            </div>
          `
          : "";


      const note =
        String(item.note || "").trim()
          ? `
            <span class="song-note">
              ${escapeHtml(item.note)}
            </span>
          `
          : "";


      const hasVideo =
        Boolean(
          String(stream.videoId || "")
            .trim()
        );


      const timeLinks =
        (item.parts || [])
          .map(part => {

            const label =
              part.label
                ? `${escapeHtml(part.label)} `
                : "";

            const displayTime =
              `${label}${escapeHtml(part.time)}`;


            if (!hasVideo) {
              return `<span>${displayTime}</span>`;
            }


            const seconds =
              timeToSeconds(
                part.time
              );


            return `
              <a
                href="https://www.youtube.com/watch?v=${encodeURIComponent(stream.videoId)}&t=${seconds}s"
                target="_blank"
                rel="noopener noreferrer"
              >
                ${displayTime} ▶
              </a>
            `;

          })
          .join("<br>");


      return `
        <article class="result-card">

          <div>

            <div class="song-name">
              ${escapeHtml(item.song)}
            </div>

            ${original}

            ${note}

          </div>


          <div>

            <div class="stream-date">
              ${formatDate(stream.date)}
            </div>

            <div
              class="stream-title"
              title="${escapeHtml(stream.title)}"
            >
              ${escapeHtml(stream.shortTitle)}
            </div>

          </div>


          <div class="song-time">
            ${timeLinks}
          </div>

        </article>
      `;

    }


    // ============================================================
    // 分頁
    // ============================================================

    function renderPagination(totalPages) {

      if (totalPages <= 1) {
        pagination.innerHTML = "";
        return;
      }


      let html = `
        <button
          class="page-button"
          type="button"
          data-page="prev"
          ${currentPage === 1 ? "disabled" : ""}
        >
          ← 上一頁
        </button>
      `;


      for (
        let page = 1;
        page <= totalPages;
        page += 1
      ) {

        html += `
          <button
            class="page-button ${currentPage === page ? "active" : ""}"
            type="button"
            data-page="${page}"
          >
            ${page}
          </button>
        `;

      }


      html += `
        <button
          class="page-button"
          type="button"
          data-page="next"
          ${currentPage === totalPages ? "disabled" : ""}
        >
          下一頁 →
        </button>
      `;


      pagination.innerHTML = html;

    }


    // ============================================================
    // 輸入即時搜尋
    // ============================================================

    searchInput.addEventListener(
      "input",
      performSearch
    );


    // ============================================================
    // 清除
    // ============================================================

    clearButton.addEventListener(
      "click",
      () => {

        searchInput.value = "";

        performSearch();

        searchInput.focus();

      }
    );


    // ============================================================
    // 分頁切換
    // ============================================================

    pagination.addEventListener(
      "click",
      event => {

        const button =
          event.target.closest(
            "[data-page]"
          );

        if (
          !button ||
          button.disabled
        ) {
          return;
        }


        const totalPages =
          Math.max(
            1,
            Math.ceil(
              currentResults.length /
              PAGE_SIZE
            )
          );


        const target =
          button.dataset.page;


        if (target === "prev") {

          currentPage =
            Math.max(
              1,
              currentPage - 1
            );

        } else if (
          target === "next"
        ) {

          currentPage =
            Math.min(
              totalPages,
              currentPage + 1
            );

        } else {

          currentPage =
            Number(target);

        }


        renderResults(
          searchInput.value.trim()
        );


        document
          .getElementById(
            "resultSection"
          )
          .scrollIntoView({
            behavior: "smooth",
            block: "start"
          });

      }
    );

  </script>

</body>
</html>
