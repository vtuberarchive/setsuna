<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SONG SEARCH｜剎那 SETSUNA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #0d0f14;
      color: #f5f5f5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13, 15, 20, 0.95);
      border-bottom: 1px solid #242833;
      backdrop-filter: blur(10px);
    }

    .nav {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
    }

    .logo span {
      color: #ff7aa8;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links a {
      color: #c8ccd5;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .nav-links a:hover,
    .nav-links .active {
      color: #ff7aa8;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 24px 100px;
    }

    /* =========================
       HERO
    ========================= */

    .search-hero {
      margin-bottom: 48px;
    }

    .search-hero h1 {
      margin: 0;
      font-size: clamp(48px, 7vw, 82px);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .search-hero h1 span {
      color: #ff7aa8;
    }

    .search-intro {
      margin: 24px 0 0;
      max-width: 760px;
      color: #c5cad3;
      font-size: 17px;
      line-height: 1.9;
    }

    /* =========================
       SEARCH BOX
    ========================= */

    .search-panel {
      margin-bottom: 44px;
      padding: 28px;
      background: #151820;
      border: 1px solid #242936;
      border-radius: 18px;
    }

    .search-row {
      display: flex;
      gap: 12px;
    }

    .search-box {
      width: 100%;
      padding: 16px 18px;
      color: #f5f5f5;
      background: #0d0f14;
      border: 1px solid #343a49;
      border-radius: 12px;
      outline: none;
      transition: 0.2s ease;
    }

    .search-box::placeholder {
      color: #737b89;
    }

    .search-box:focus {
      border-color: #ff7aa8;
      box-shadow: 0 0 0 3px rgba(255, 122, 168, 0.12);
    }

    .clear-button {
      flex-shrink: 0;
      padding: 0 22px;
      color: #c5cad3;
      background: #20242d;
      border: 1px solid #343a49;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .clear-button:hover {
      color: #ffffff;
      border-color: #ff7aa8;
    }

    .search-help {
      margin: 14px 2px 0;
      color: #808795;
      font-size: 13px;
      line-height: 1.7;
    }

    /* =========================
       RESULT TITLE
    ========================= */

    .result-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .result-header h2 {
      margin: 0;
      font-size: 28px;
    }

    .result-status {
      color: #8f96a3;
      font-size: 14px;
    }

    /* =========================
       EMPTY / START
    ========================= */

    .message-box {
      padding: 42px 28px;
      text-align: center;
      color: #8f96a3;
      background: #151820;
      border: 1px solid #242936;
      border-radius: 18px;
      line-height: 1.8;
    }

    .message-box strong {
      color: #f5f5f5;
    }

    /* =========================
       RESULTS
    ========================= */

    .results {
      display: grid;
      gap: 14px;
    }

    .song-card {
      display: grid;
      grid-template-columns: minmax(220px, 1.4fr) minmax(180px, 1fr) minmax(190px, 1fr);
      gap: 24px;
      align-items: center;
      padding: 22px 24px;
      background: #151820;
      border: 1px solid #242936;
      border-radius: 16px;
      transition: 0.2s ease;
    }

    .song-card:hover {
      transform: translateY(-2px);
      border-color: #3a4050;
    }

    .song-name {
      margin-bottom: 6px;
      color: #f5f5f5;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.5;
    }

    .song-original {
      color: #989fac;
      font-size: 14px;
      line-height: 1.6;
    }

    .note-tag {
      display: inline-block;
      margin-top: 9px;
      padding: 4px 8px;
      color: #ffd1df;
      background: #512537;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }

    .stream-meta {
      color: #aeb4c2;
      font-size: 14px;
      line-height: 1.7;
    }

    .stream-date {
      margin-bottom: 4px;
      color: #ff7aa8;
      font-size: 13px;
      font-weight: 700;
    }

    .stream-title {
      color: #c5cad3;
    }

    .time-links {
      text-align: right;
    }

    .time-links a {
      display: inline-block;
      margin: 3px 0;
      color: #f5f5f5;
      font-size: 14px;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .time-links a:hover {
      color: #ff7aa8;
    }

    .no-video {
      color: #737b89;
      font-size: 13px;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      padding: 34px 20px;
      border-top: 1px solid #242833;
      color: #747b89;
      text-align: center;
      font-size: 13px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 760px) {
      .nav {
        align-items: flex-start;
      }

      .nav-links {
        gap: 12px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      main {
        padding: 50px 20px 70px;
      }

      .search-hero {
        margin-bottom: 36px;
      }

      .search-row {
        flex-direction: column;
      }

      .clear-button {
        padding: 14px 18px;
      }

      .result-header {
        display: block;
      }

      .result-status {
        margin-top: 8px;
      }

      .song-card {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .time-links {
        text-align: left;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="nav">

      <div class="logo">
        VTuber <span>Archive</span>
      </div>

      <nav class="nav-links">
        <a href="index.html">HOME</a>
        <a href="profile.html">PROFILE</a>
        <a href="streams.html">STREAMS</a>
        <a href="search.html" class="active">SONG SEARCH</a>
        <a href="index.html#merch">MERCH</a>
        <a href="index.html#about">ABOUT</a>
      </nav>

    </div>
  </header>

  <main>

    <!-- HERO -->

    <section class="search-hero">

      <h1>
        Song <span>Search</span>
      </h1>

      <p class="search-intro">
        搜尋剎那 SETSUNA 的演唱紀錄。<br>
        可依歌名、原唱、日期或歌回名稱搜尋，並直接跳轉至 YouTube 演唱時間軸。
      </p>

    </section>

    <!-- SEARCH -->

    <section class="search-panel">

      <div class="search-row">

        <input
          id="searchInput"
          class="search-box"
          type="search"
          autocomplete="off"
          placeholder="搜尋歌名、原唱、日期或歌回，例如：Aimer、晴天、2026-09..."
        >

        <button
          id="clearButton"
          class="clear-button"
          type="button"
        >
          清除
        </button>

      </div>

      <p class="search-help">
        不輸入關鍵字時不會顯示全部歌曲。輸入內容後會即時搜尋目前收錄的演唱紀錄。
      </p>

    </section>

    <!-- RESULTS -->

    <section>

      <div class="result-header">

        <h2>搜尋結果</h2>

        <div
          id="resultStatus"
          class="result-status"
        >
          請輸入關鍵字
        </div>

      </div>

      <div
        id="songResults"
        class="results"
      >

        <div class="message-box">
          輸入<strong>歌名、原唱、日期或歌回名稱</strong>開始搜尋。
        </div>

      </div>

    </section>

  </main>

  <footer>
    VTuber Archive · SETSUNA Unofficial Fan Project
  </footer>

  <!-- 共用資料 -->

  <script src="streams-data.js"></script>
  <script src="songs-data.js"></script>

  <script>

    // =========================
    // 取得資料
    // =========================

    const streams = window.SETSUNA_DATA?.streams || [];
    const songs = window.SETSUNA_DATA?.songs || [];

    const searchInput = document.getElementById("searchInput");
    const clearButton = document.getElementById("clearButton");
    const songResults = document.getElementById("songResults");
    const resultStatus = document.getElementById("resultStatus");


    // =========================
    // 建立歌回索引
    // =========================

    const streamMap = new Map(
      streams.map(stream => [
        stream.id,
        stream
      ])
    );


    // =========================
    // 文字標準化
    // =========================

    function normalizeText(value) {
      return String(value || "")
        .normalize("NFKC")
        .toLowerCase()
        .trim();
    }


    // =========================
    // 時間轉秒數
    // =========================

    function timeToSeconds(time) {

      if (!time) {
        return 0;
      }

      const parts = time
        .split(":")
        .map(Number);

      if (parts.length === 3) {
        return (
          parts[0] * 3600 +
          parts[1] * 60 +
          parts[2]
        );
      }

      if (parts.length === 2) {
        return (
          parts[0] * 60 +
          parts[1]
        );
      }

      return 0;
    }


    // =========================
    // 日期顯示格式
    // =========================

    function formatDate(date) {
      return String(date || "")
        .replaceAll("-", "／");
    }


    // =========================
    // 安全輸出文字
    // =========================

    function escapeHTML(value) {

      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    // =========================
    // 搜尋
    // =========================

    function renderSearch() {

      const query = normalizeText(
        searchInput.value
      );

      // 空白時不顯示全部資料
      if (!query) {

        resultStatus.textContent =
          "請輸入關鍵字";

        songResults.innerHTML = `
          <div class="message-box">
            輸入<strong>歌名、原唱、日期或歌回名稱</strong>開始搜尋。
          </div>
        `;

        return;
      }


      // 支援空格分開多個關鍵字
      const keywords = query
        .split(/\s+/)
        .filter(Boolean);


      const filtered = songs.filter(item => {

        const stream =
          streamMap.get(item.streamId);

        if (!stream) {
          return false;
        }

        const searchableText = normalizeText([
          item.song,
          item.original,
          item.note,
          stream.date,
          stream.shortTitle,
          stream.fullTitle
        ].join(" "));

        return keywords.every(keyword =>
          searchableText.includes(keyword)
        );

      });


      // 最新日期優先
      filtered.sort((a, b) => {

        const streamA =
          streamMap.get(a.streamId);

        const streamB =
          streamMap.get(b.streamId);

        return String(streamB?.date || "")
          .localeCompare(
            String(streamA?.date || "")
          );

      });


      resultStatus.textContent =
        `找到 ${filtered.length} 筆演唱紀錄`;


      if (filtered.length === 0) {

        songResults.innerHTML = `
          <div class="message-box">
            找不到符合
            <strong>${escapeHTML(searchInput.value)}</strong>
            的演唱紀錄。
          </div>
        `;

        return;
      }


      songResults.innerHTML =
        filtered.map(item => {

          const stream =
            streamMap.get(item.streamId);

          const songName =
            escapeHTML(item.song);

          const original =
            item.original
              ? escapeHTML(item.original)
              : "原唱資料待補";

          const note =
            item.note
              ? `
                <div class="note-tag">
                  ${escapeHTML(item.note)}
                </div>
              `
              : "";


          const timeLinks =
            (item.parts || [])
              .map(part => {

                const label =
                  part.label
                    ? `${escapeHTML(part.label)} `
                    : "";

                const time =
                  escapeHTML(part.time);

                if (!stream.videoId) {

                  return `
                    <div class="no-video">
                      ${label}${time}
                    </div>
                  `;

                }

                const seconds =
                  timeToSeconds(part.time);

                const url =
                  `https://www.youtube.com/watch?v=${encodeURIComponent(stream.videoId)}&t=${seconds}s`;

                return `
                  <a
                    href="${url}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    ${label}${time} ▶
                  </a>
                `;

              })
              .join("<br>");


          return `
            <article class="song-card">

              <div>

                <div class="song-name">
                  ${songName}
                </div>

                <div class="song-original">
                  ${original}
                </div>

                ${note}

              </div>


              <div class="stream-meta">

                <div class="stream-date">
                  ${formatDate(stream.date)}
                </div>

                <div class="stream-title">
                  ${escapeHTML(stream.shortTitle)}
                </div>

              </div>


              <div class="time-links">
                ${timeLinks}
              </div>

            </article>
          `;

        })
        .join("");

    }


    // =========================
    // 即時搜尋
    // =========================

    searchInput.addEventListener(
      "input",
      renderSearch
    );


    // =========================
    // 清除搜尋
    // =========================

    clearButton.addEventListener(
      "click",
      () => {

        searchInput.value = "";

        renderSearch();

        searchInput.focus();

      }
    );

  </script>

</body>
</html>
